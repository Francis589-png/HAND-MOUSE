name: HAND-MOUSE Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "companion/**"
      - "netlify.toml"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "companion/**"
      - "netlify.toml"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: hand-mouse-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Real browser WebRTC test
        run: npm run test:e2e

  companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install companion dependencies
        run: python -m pip install -r companion/requirements.txt
      - name: Companion protocol tests
        run: python -m unittest discover -s companion/tests -v
      - name: Real companion integration test
        env:
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID' EXIT
          python -m unittest companion.tests.test_server_integration -v
