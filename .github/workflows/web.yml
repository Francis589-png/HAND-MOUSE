name: HAND-MOUSE Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "netlify.toml"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "netlify.toml"
      - "firebase.json"
      - "database.rules.json"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: hand-mouse-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Real browser WebRTC test
        run: npm run test:e2e
